<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안경사 국가고시 - 초간편 문제 추가 관리자</title>
<style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
        --primary: #4a90e2;
        --secondary: #27ae60;
        --bg-color: #f0f4f8;
        --card-bg: #ffffff;
        --text-main: #2d3436;
        --text-muted: #636e72;
        --btn-hover: #357abd;
    }
    
    * { box-sizing: border-box; }
    
    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        color: var(--text-main);
    }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 600px; }
    h1 { color: #2c3e50; margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 700; }
    
    .nav-links {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .nav-link-btn {
        background: white;
        border: 1px solid #dfe6e9;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
    }
    .nav-link-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }
    
    .container {
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        margin-bottom: 20px;
    }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; color: #2c3e50; font-size: 0.95rem; }
    select, textarea, input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #dfe6e9;
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        background: #fafbfc;
        transition: border 0.2s;
    }
    select:focus, textarea:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        background: white;
    }
    textarea { resize: vertical; min-height: 100px; }
    
    .helper-text { font-size: 0.82rem; color: #7f8c8d; margin-top: 6px; line-height: 1.4; }
    
    .btn-submit {
        background-color: var(--secondary);
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
    }
    .btn-submit:hover { background-color: #219653; transform: translateY(-1px); }
    
    .action-panel {
        background: #2d3436;
        color: white;
        padding: 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 600px;
        text-align: center;
    }
    .btn-download {
        background: #e67e22;
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 4px 6px rgba(230, 126, 34, 0.3);
        transition: background 0.2s;
    }
    .btn-download:hover { background: #d35400; }
    .status-msg { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="header">
    <h1>안경사 국가고시 문제 추가 도구 📝</h1>
    <div class="nav-links">
        <a href="advanced_flashcards.html" class="nav-link-btn">암기 카드 실행하기</a>
        <a href="admin_add.html" class="nav-link-btn active">문제 추가하기</a>
    </div>
</div>

<div class="container">
    <form id="addForm">
        <div class="form-group">
            <label for="category">과목 (카테고리)</label>
            <select id="category" required></select>
        </div>
        
        <div class="form-group">
            <label for="question">질문 (Q)</label>
            <textarea id="question" placeholder="예: 빛이 굴절률 n₁인 매질에서..." required></textarea>
        </div>
        
        <div class="form-group">
            <label for="answer">정답 및 해설 (A)</label>
            <textarea id="answer" placeholder="정답을 입력하세요. 수식 해설이 있다면 아래 예시처럼 작성하세요.&#10;예시: +1.00 D *(해설: F_total = F_1 + F_2 => +5.00 = +4.00 + F_2 => F_2 = +1.00 D)*" required></textarea>
            <div class="helper-text">
                💡 <b>수식 해설 팁:</b> 답변 안에 <code>*(해설: 공식명 => 수식계산단계 => 최종결과)*</code> 형식으로 작성하시면 메인 화면에서 자동으로 스마트 수식 카드로 변환됩니다!
            </div>
        </div>
        
        <button type="submit" class="btn-submit">➕ 목록에 문제 추가하기</button>
    </form>
</div>

<div class="action-panel">
    <div class="status-msg" id="statusMsg">현재 담긴 추가 문제: <b>0</b>개</div>
    <button class="btn-download" id="downloadBtn">📥 완성된 data.json 파일 다운로드</button>
    <div class="helper-text" style="color: #95a5a6; margin-top: 10px;">
        버튼을 누르면 기존 문제 + 새로 추가한 문제가 모두 포함된 <b>data.json</b> 파일이 다운로드됩니다.<br>그 파일을 깃허브 저장소에 그대로 올리시면 끝납니다!
    </div>
</div>

<script>
    const defaultCategories = [
        "의료관계법규",
        "시광학응용",
        "2025년 시광학이론",
        "2024년 시광학이론",
        "종합본"
    ];

    let originalData = [];
    let customQuestions = JSON.parse(localStorage.getItem('my_custom_questions') || '[]');

    async function initData() {
        const select = document.getElementById('category');
        let categories = [...defaultCategories];
        
        try {
            const response = await fetch('data.json');
            if (response.ok) {
                originalData = await response.json();
                const fetchedCats = [...new Set(originalData.map(item => item.cat))];
                fetchedCats.forEach(cat => {
                    if (!categories.includes(cat)) categories.push(cat);
                });
            }
        } catch (e) {
            console.log('data.json 로드 실패, 기본 카테고리 사용');
        }
        
        select.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });
        
        updateStatus();
    }

    document.getElementById('addForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const cat = document.getElementById('category').value;
        const q = document.getElementById('question').value.trim();
        const a = document.getElementById('answer').value.trim();
        
        const newObj = { q: q, a: a, cat: cat };
        
        customQuestions.push(newObj);
        localStorage.setItem('my_custom_questions', JSON.stringify(customQuestions));
        
        document.getElementById('question').value = '';
        document.getElementById('answer').value = '';
        
        updateStatus();
        alert('✨ 임시 목록에 추가되었습니다! (하단의 다운로드 버튼을 눌러주세요)');
    });

    function updateStatus() {
        document.getElementById('statusMsg').innerHTML = `현재 담긴 추가 문제: <b>${customQuestions.length}</b>개`;
    }

    document.getElementById('downloadBtn').addEventListener('click', function() {
        // 기존 data.json 데이터 + 내가 추가한 커스텀 문제들을 합침
        const finalData = [...originalData, ...customQuestions];
        
        if (finalData.length === 0) {
            alert('저장할 데이터가 없습니다.');
            return;
        }

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        
        alert('🎉 data.json 파일이 성공적으로 다운로드되었습니다!\n이 파일을 깃허브에 그대로 업로드해 주세요.');
    });

    window.addEventListener('DOMContentLoaded', initData);
</script>
</body>
</html>
