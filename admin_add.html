<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안경사 국가고시 - 스마트 문제 추가 관리자</title>
<style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
        --primary: #4a90e2;
        --secondary: #27ae60;
        --bg-color: #f0f4f8;
        --card-bg: #ffffff;
        --text-main: #2d3436;
        --text-muted: #636e72;
        --btn-hover: #357abd;
    }
    
    * { box-sizing: border-box; }
    
    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        color: var(--text-main);
    }
    
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 600px; }
    h1 { color: #2c3e50; margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 700; }
    
    .nav-links {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .nav-link-btn {
        background: white;
        border: 1px solid #dfe6e9;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
    }
    .nav-link-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }
    
    /* 파일 업로드 안내 박스 */
    .upload-box {
        width: 100%;
        max-width: 600px;
        background: #fff;
        border: 2px dashed #4a90e2;
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .upload-box.loaded {
        border-color: var(--secondary);
        background: #f0fdf4;
    }
    
    .container {
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: none; /* 파일 업로드 전에는 숨김 */
    }
    .container.active { display: block; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; color: #2c3e50; font-size: 0.95rem; }
    select, textarea, input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #dfe6e9;
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        background: #fafbfc;
        transition: border 0.2s;
    }
    select:focus, textarea:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        background: white;
    }
    textarea { resize: vertical; min-height: 100px; }
    
    .helper-text { font-size: 0.82rem; color: #7f8c8d; margin-top: 6px; line-height: 1.4; }
    
    .btn-submit {
        background-color: var(--secondary);
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
    }
    .btn-submit:hover { background-color: #219653; transform: translateY(-1px); }
    
    .action-panel {
        background: #2d3436;
        color: white;
        padding: 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 600px;
        text-align: center;
        display: none;
    }
    .action-panel.active { display: block; }
    .btn-download {
        background: #e67e22;
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 4px 6px rgba(230, 126, 34, 0.3);
        transition: background 0.2s;
    }
    .btn-download:hover { background: #d35400; }
    .status-msg { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 10px; }
    .btn-clear {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-clear:hover { background: rgba(231, 76, 60, 0.1); }
</style>
</head>
<body>

<div class="header">
    <h1>안경사 국가고시 문제 추가 도구 📝</h1>
    <div class="nav-links">
        <a href="advanced_flashcards.html" class="nav-link-btn">암기 카드 실행하기</a>
        <a href="admin_add.html" class="nav-link-btn active">문제 추가하기</a>
    </div>
</div>

<!-- 1단계: 기존 data.json 파일 업로드 영역 -->
<div class="upload-box" id="uploadBox">
    <h3>📂 기존 data.json 파일 불러오기</h3>
    <p style="font-size: 0.9rem; color: #636e72; margin-bottom: 12px;">안전한 연동을 위해 내 컴퓨터에 있는 <b>data.json</b> 파일을 선택해주세요.</p>
    <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
    <button type="button" class="action-btn" id="fileSelectBtn" style="margin: 0 auto; background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">파일 선택하기</button>
</div>

<!-- 2단계: 문제 입력 폼 -->
<div class="container" id="mainContainer">
    <form id="addForm">
        <div class="form-group">
            <label for="category">과목 (카테고리)</label>
            <select id="category" required></select>
        </div>
        
        <div class="form-group">
            <label for="question">질문 (Q)</label>
            <textarea id="question" placeholder="예: 빛이 굴절률 n₁인 매질에서..." required></textarea>
        </div>
        
        <div class="form-group">
            <label for="answer">정답 및 해설 (A)</label>
            <textarea id="answer" placeholder="정답을 입력하세요. 수식 해설이 있다면 아래 예시처럼 작성하세요.&#10;예시: +1.00 D *(해설: F_total = F_1 + F_2 => +5.00 = +4.00 + F_2 => F_2 = +1.00 D)*" required></textarea>
            <div class="helper-text">
                💡 <b>수식 해설 팁:</b> 답변 안에 <code>*(해설: 공식명 => 수식계산단계 => 최종결과)*</code> 형식으로 작성하시면 메인 화면에서 자동으로 스마트 수식 카드로 변환됩니다!
            </div>
        </div>
        
        <button type="submit" class="btn-submit">➕ 대기열에 문제 추가하기</button>
    </form>
</div>

<!-- 3단계: 다운로드 패널 -->
<div class="action-panel" id="actionPanel">
    <div class="status-msg" id="statusMsg">연동 완료</div>
    <button class="btn-download" id="downloadBtn">📥 병합된 최신 data.json 다운로드</button>
    <div>
        <button class="btn-clear" id="clearBtn">새로 추가한 목록 초기화 (비우기)</button>
    </div>
    <div class="helper-text" style="color: #95a5a6; margin-top: 15px;">
        💡 버튼을 누르면 기존 문제와 <b>새로 추가한 문제들</b>이 중복 없이 완벽히 병합된 최신 <b>data.json</b> 파일이 다운로드됩니다.
    </div>
</div>

<script>
    const defaultCategories = [
        "의료관계법규",
        "시광학응용",
        "2025년 시광학이론",
        "2024년 시광학이론",
        "종합본"
    ];

    let originalData = [];
    let customQuestions = JSON.parse(localStorage.getItem('my_custom_questions') || '[]');

    const fileInput = document.getElementById('jsonFileInput');
    const fileSelectBtn = document.getElementById('fileSelectBtn');
    const uploadBox = document.getElementById('uploadBox');
    const mainContainer = document.getElementById('mainContainer');
    const actionPanel = document.getElementById('actionPanel');

    fileSelectBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                originalData = JSON.parse(event.target.result);
                setupApp();
                uploadBox.classList.add('loaded');
                uploadBox.innerHTML = `<h3>✅ data.json 로드 완료! (${originalData.length}개의 기존 문제)</h3>`;
                mainContainer.classList.add('active');
                actionPanel.classList.add('active');
            } catch (err) {
                alert('JSON 파일 형식이 올바르지 않습니다.');
            }
        };
        reader.readAsText(file);
    });

    function setupApp() {
        const select = document.getElementById('category');
        let categories = [...defaultCategories];
        
        const fetchedCats = [...new Set(originalData.map(item => item.cat))];
        fetchedCats.forEach(cat => {
            if (!categories.includes(cat)) categories.push(cat);
        });
        
        select.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });
        
        cleanupCustomQuestions();
        updateStatus();
    }

    function cleanupCustomQuestions() {
        if (originalData.length === 0) return;
        const originalQuestionsSet = new Set(originalData.map(item => item.q.trim()));
        const filtered = customQuestions.filter(item => !originalQuestionsSet.has(item.q.trim()));
        if (filtered.length !== customQuestions.length) {
            customQuestions = filtered;
            localStorage.setItem('my_custom_questions', JSON.stringify(customQuestions));
        }
    }

    document.getElementById('addForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const cat = document.getElementById('category').value;
        const q = document.getElementById('question').value.trim();
        const a = document.getElementById('answer').value.trim();
        
        const existsInOriginal = originalData.some(item => item.q.trim() === q);
        const existsInCustom = customQuestions.some(item => item.q.trim() === q);
        
        if (existsInOriginal || existsInCustom) {
            alert('⚠️ 이미 동일한 질문이 등록되어 있습니다!');
            return;
        }
        
        const newObj = { q: q, a: a, cat: cat };
        customQuestions.push(newObj);
        localStorage.setItem('my_custom_questions', JSON.stringify(customQuestions));
        
        document.getElementById('question').value = '';
        document.getElementById('answer').value = '';
        
        updateStatus();
        alert('✨ 대기열에 추가되었습니다! (하단의 다운로드 버튼을 눌러주세요)');
    });

    function updateStatus() {
        document.getElementById('statusMsg').innerHTML = `기존 data.json (${originalData.length}개) + 새로 추가된 문제: <b>${customQuestions.length}</b>개`;
    }

    document.getElementById('downloadBtn').addEventListener('click', function() {
        const finalData = [...originalData, ...customQuestions];
        
        if (finalData.length === 0) {
            alert('저장할 데이터가 없습니다.');
            return;
        }

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        
        alert('🎉 data.json 파일 다운로드 완료!\n깃허브에 이 파일을 그대로 올리시면 끝납니다.');
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
        if(confirm('새로 추가한 대기 목록을 비우시겠습니까?')) {
            customQuestions = [];
            localStorage.removeItem('my_custom_questions');
            updateStatus();
        }
    });
</script>
</body>
</html>
